<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍅 精英番茄钟 Pro</title>
    <style>
        :root {
            --primary: #ef4444;
            --theme-color: #ef4444;
            --bg-work: linear-gradient(160deg, #fef2f2 0%, #fee2e2 100%);
            --bg-short: linear-gradient(160deg, #f0fdf4 0%, #dcfce7 100%);
            --bg-long: linear-gradient(160deg, #eff6ff 0%, #dbeafe 100%);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, "Microsoft YaHei", sans-serif;
        }
        
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-work);
            transition: background 0.5s ease;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }
        
        #notifyBar {
            position: fixed;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: #1e293b;
            color: white;
            border-radius: 16px;
            padding: 16px 20px;
            transition: top 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 9999;
            box-shadow: 0 12px 30px rgba(0,0,0,0.2);
        }
        
        #notifyBar.show {
            top: 20px;
        }
        
        .notify-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }
        
        .notify-msg {
            flex: 1;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
        }
        
        .notify-btns {
            display: flex;
            gap: 8px;
        }
        
        .notify-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            transition: all 0.2s;
            white-space: nowrap;
        }
        
        .notify-btn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }
        
        .notify-btn.primary {
            background: var(--theme-color);
            color: white;
        }
        
        .notify-btn.secondary {
            background: #475569;
            color: white;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 32px;
            padding: 35px 40px 30px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            text-align: center;
            position: relative;
            z-index: 10;
        }
        
        h1 {
            font-size: 1.5rem;
            color: #1e293b;
            margin: 0 0 20px;
            font-weight: 800;
        }
        
        .tabs {
            display: flex;
            background: rgba(0,0,0,0.05);
            padding: 5px;
            border-radius: 14px;
            margin-bottom: 25px;
        }
        
        .tab {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .tab:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .tab.active {
            background: white;
            color: var(--theme-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        }
        
        .timer-box {
            position: relative;
            margin: 15px auto 25px;
            width: 220px;
            height: 220px;
        }
        
        .timer-svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }
        
        .circle-bg {
            fill: none;
            stroke: rgba(0,0,0,0.04);
            stroke-width: 10;
        }
        
        .circle-progress {
            fill: none;
            stroke: var(--theme-color);
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke 0.5s ease, stroke-dashoffset 0.2s linear;
        }
        
        .time-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3.5rem;
            font-weight: 800;
            color: #1e293b;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }
        
        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .btn {
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-main {
            background: #1e293b;
            color: white;
            flex: 2;
            padding: 16px;
            box-shadow: 0 4px 12px rgba(30, 41, 59, 0.2);
        }
        
        .btn-main:hover {
            box-shadow: 0 6px 16px rgba(30, 41, 59, 0.3);
        }
        
        .btn-icon {
            background: white;
            color: #1e293b;
            flex: 1;
            border: 1.5px solid #e2e8f0;
            padding: 16px;
        }
        
        .btn-icon:hover {
            background: #f8fafc;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding-top: 20px;
            border-top: 1.5px solid rgba(0,0,0,0.06);
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-v {
            display: block;
            font-size: 1.3rem;
            font-weight: 800;
            color: #1e293b;
        }
        
        .stat-l {
            font-size: 0.7rem;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.show {
            display: flex;
        }
        
        .modal-body {
            background: white;
            border-radius: 24px;
            padding: 30px;
            width: 320px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            animation: modalIn 0.3s ease;
        }
        
        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .modal-header {
            font-weight: 800;
            margin-bottom: 25px;
            text-align: center;
            color: #1e293b;
            font-size: 1.2rem;
        }
        
        .s-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .s-label {
            font-size: 0.9rem;
            font-weight: 700;
            color: #475569;
        }
        
        .s-input {
            width: 85px;
            padding: 10px;
            border: 2px solid #f1f5f9;
            border-radius: 12px;
            text-align: center;
            font-weight: 800;
            color: var(--theme-color);
            user-select: auto;
            -webkit-user-select: auto;
            font-size: 1.1rem;
            transition: border-color 0.3s;
        }
        
        .s-input:focus {
            border-color: var(--theme-color);
            outline: none;
        }
        
        .m-btns {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        
        .m-btns button {
            flex: 1;
            padding: 12px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .m-btns button:hover {
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div id="notifyBar">
        <div class="notify-content">
            <div class="notify-msg" id="notifyMsg">专注完成！</div>
            <div class="notify-btns">
                <button class="notify-btn primary" id="notifyOk">开始休息</button>
                <button class="notify-btn secondary" id="notifyCancel">忽略</button>
            </div>
        </div>
    </div>

    <div class="glass-card">
        <h1>🍅 精英番茄钟 Pro</h1>
        <div class="tabs">
            <button class="tab active" data-mode="work">专注模式</button>
            <button class="tab" data-mode="short">短休息</button>
            <button class="tab" data-mode="long">长休息</button>
        </div>
        <div class="timer-box">
            <svg class="timer-svg" viewBox="0 0 300 300">
                <circle class="circle-bg" cx="150" cy="150" r="140"></circle>
                <circle class="circle-progress" id="progressCircle" cx="150" cy="150" r="140" stroke-dasharray="879.646" stroke-dashoffset="879.646"></circle>
            </svg>
            <div class="time-text" id="display">25:00</div>
        </div>
        <div class="actions">
            <button class="btn btn-main" id="startBtn">开始专注</button>
            <button class="btn btn-icon" id="resetBtn">重置</button>
            <button class="btn btn-icon" id="setBtn">⚙️</button>
        </div>
        <div class="stats-bar">
            <div class="stat">
                <span class="stat-v" id="statC">0</span>
                <span class="stat-l">已完成番茄</span>
            </div>
            <div class="stat">
                <span class="stat-v" id="statT">0</span>
                <span class="stat-l">总专注分钟</span>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-body">
            <div class="modal-header">偏好设置 (分钟)</div>
            <div class="s-row">
                <span class="s-label">工作时间</span>
                <input type="number" class="s-input" id="inW" min="1" max="99" value="25">
            </div>
            <div class="s-row">
                <span class="s-label">短休息</span>
                <input type="number" class="s-input" id="inS" min="1" max="60" value="5">
            </div>
            <div class="s-row">
                <span class="s-label">长休息</span>
                <input type="number" class="s-input" id="inL" min="1" max="60" value="15">
            </div>
            <div class="m-btns">
                <button style="background:#f1f5f9; color:#64748b" id="closeBtn">取消</button>
                <button style="background:#1e293b; color:white" id="saveBtn">保存</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEYS = {
            MODES: 'pomodoro_modes_v2',
            STATS: 'pomodoro_stats_v2',
            NOTIFICATION_ASKED: 'pomodoro_notification_asked'
        };

        const DEFAULT_MODES = { work: 25, short: 5, long: 15 };

        function loadFromStorage(key, defaultValue) {
            try {
                const stored = localStorage.getItem(key);
                return stored ? JSON.parse(stored) : defaultValue;
            } catch (e) {
                console.warn('localStorage read error:', e);
                return defaultValue;
            }
        }

        function saveToStorage(key, value) {
            try {
                localStorage.setItem(key, JSON.stringify(value));
                return true;
            } catch (e) {
                console.warn('localStorage write error:', e);
                return false;
            }
        }

        const state = {
            modes: loadFromStorage(STORAGE_KEYS.MODES, DEFAULT_MODES),
            currentMode: 'work',
            timeLeft: 0,
            isActive: false,
            endTime: null,
            intervalId: null,
            audioContext: null,
            stats: loadFromStorage(STORAGE_KEYS.STATS, { completed: 0, totalMinutes: 0 }),
            nextSuggestedMode: null
        };

        state.timeLeft = state.modes.work * 60;

        const els = {
            display: document.getElementById('display'),
            circle: document.getElementById('progressCircle'),
            startBtn: document.getElementById('startBtn'),
            resetBtn: document.getElementById('resetBtn'),
            setBtn: document.getElementById('setBtn'),
            tabs: document.querySelectorAll('.tab'),
            statC: document.getElementById('statC'),
            statT: document.getElementById('statT'),
            modal: document.getElementById('modal'),
            notifyBar: document.getElementById('notifyBar'),
            notifyMsg: document.getElementById('notifyMsg'),
            notifyOk: document.getElementById('notifyOk'),
            notifyCancel: document.getElementById('notifyCancel'),
            inputs: {
                work: document.getElementById('inW'),
                short: document.getElementById('inS'),
                long: document.getElementById('inL')
            }
        };

        const THEMES = {
            work: { bg: 'var(--bg-work)', color: '#ef4444' },
            short: { bg: 'var(--bg-short)', color: '#22c55e' },
            long: { bg: 'var(--bg-long)', color: '#3b82f6' }
        };

        function ensureAudioContext() {
            if (!state.audioContext) {
                try {
                    state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.warn('AudioContext not supported:', e);
                    return false;
                }
            }
            
            if (state.audioContext.state === 'suspended') {
                state.audioContext.resume().catch(e => console.warn('Resume failed:', e));
            }
            
            return state.audioContext.state === 'running';
        }

        function playBeep() {
            if (!ensureAudioContext()) return;
            
            try {
                const ctx = state.audioContext;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.type = 'sine';
                
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.6);
            } catch (e) {
                console.warn('Beep failed:', e);
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function updateDisplay() {
            const timeStr = formatTime(state.timeLeft);
            els.display.textContent = timeStr;

            const totalSeconds = state.modes[state.currentMode] * 60;
            const progress = totalSeconds > 0 ? 1 - (state.timeLeft / totalSeconds) : 0;
            els.circle.style.strokeDashoffset = 879.646 * (1 - progress);

            const icon = state.currentMode === 'work' ? '🍅' : '☕';
            const status = state.isActive ? '' : '❚❚ ';
            document.title = `${status}${icon} ${timeStr} - 精英番茄钟 Pro`;
        }

        function updateStats() {
            els.statC.textContent = state.stats.completed;
            els.statT.textContent = state.stats.totalMinutes;
        }

        function saveStats() {
            saveToStorage(STORAGE_KEYS.STATS, state.stats);
            updateStats();
        }

        function applyTheme(mode) {
            const theme = THEMES[mode];
            document.body.style.background = theme.bg;
            document.documentElement.style.setProperty('--theme-color', theme.color);
        }

        function showNotification(message, suggestedMode) {
            state.nextSuggestedMode = suggestedMode;
            els.notifyMsg.textContent = message;
            
            const modeText = suggestedMode === 'work' ? '开始专注' : 
                           suggestedMode === 'short' ? '短休息' : '长休息';
            els.notifyOk.textContent = modeText;
            
            els.notifyBar.classList.add('show');
            playBeep();

            if ('Notification' in window && Notification.permission === 'granted') {
                try {
                    new Notification('🍅 精英番茄钟', { 
                        body: message,
                        silent: true
                    });
                } catch (e) {
                    console.warn('Desktop notification failed:', e);
                }
            }
        }

        function hideNotification() {
            els.notifyBar.classList.remove('show');
        }

        function startTimer() {
            ensureAudioContext();
            
            if (state.isActive) {
                pauseTimer();
                return;
            }

            state.isActive = true;
            updateButtonText();
            
            state.endTime = Date.now() + state.timeLeft * 1000;

            state.intervalId = setInterval(() => {
                const now = Date.now();
                const remaining = Math.max(0, Math.ceil((state.endTime - now) / 1000));

                if (remaining === 0) {
                    finishTimer();
                } else {
                    state.timeLeft = remaining;
                    updateDisplay();
                }
            }, 200);
            
            updateDisplay();
        }

        function pauseTimer() {
            state.isActive = false;
            if (state.intervalId) {
                clearInterval(state.intervalId);
                state.intervalId = null;
            }
            updateButtonText();
            updateDisplay();
        }

        function resetTimer() {
            if (state.isActive) {
                const confirmMsg = state.currentMode === 'work' 
                    ? '确定中断当前专注？' 
                    : '确定跳过当前休息？';
                
                if (!confirm(confirmMsg)) return;
				pauseTimer();
            }

            if (state.intervalId) {
                clearInterval(state.intervalId);
                state.intervalId = null;
            }
            state.isActive = false;
            
            if (state.currentMode !== 'work') {
                switchMode('work');
            } else {
                state.timeLeft = state.modes[state.currentMode] * 60;
                updateButtonText();
                updateDisplay();
            }
        }

        function finishTimer() {
            if (state.intervalId) {
                clearInterval(state.intervalId);
                state.intervalId = null;
            }
            state.isActive = false;
            state.timeLeft = 0;
            updateDisplay();
            updateButtonText();

            if (state.currentMode === 'work') {
                state.stats.completed++;
                state.stats.totalMinutes += state.modes.work;
                saveStats();

                const isLongBreakTime = state.stats.completed % 4 === 0;
                const nextMode = isLongBreakTime ? 'long' : 'short';
                const message = isLongBreakTime 
                    ? '🎉 完成 4 个专注！建议长休息补充精力' 
                    : '🎉 专注完成！建议休息一下';
                
                showNotification(message, nextMode);
            } else {
                showNotification('☕ 休息结束！准备下一轮专注', 'work');
            }
        }

        function switchMode(mode) {
            if (state.isActive) {
                if (!confirm('正在计时中，切换模式将重置当前进度，确定吗？')) {
                    return;
                }
                pauseTimer();
            }

            hideNotification();
            
            state.currentMode = mode;
            state.timeLeft = state.modes[mode] * 60;
            state.isActive = false;
            
            els.tabs.forEach(tab => {
                tab.classList.toggle('active', tab.dataset.mode === mode);
            });
            
            applyTheme(mode);
            updateButtonText();
            updateDisplay();
        }

        function updateButtonText() {
            if (state.isActive) {
                els.startBtn.textContent = '暂停';
            } else {
                els.startBtn.textContent = state.currentMode === 'work' ? '开始专注' : '开始休息';
            }
            
            els.resetBtn.textContent = state.currentMode === 'work' ? '重置' : '跳过';
        }

        function openSettings() {
            els.inputs.work.value = state.modes.work;
            els.inputs.short.value = state.modes.short;
            els.inputs.long.value = state.modes.long;
            els.modal.classList.add('show');
            setTimeout(() => els.inputs.work.focus(), 100);
        }

        function closeSettings() {
            els.modal.classList.remove('show');
        }

        function validateAndSave() {
            const work = parseInt(els.inputs.work.value);
            const short = parseInt(els.inputs.short.value);
            const long = parseInt(els.inputs.long.value);

            if (isNaN(work) || work < 1 || work > 99 ||
                isNaN(short) || short < 1 || short > 60 ||
                isNaN(long) || long < 1 || long > 60) {
                alert('⚠️ 请确保所有时间为有效的正整数！\n工作时间: 1-99分钟\n短休息: 1-60分钟\n长休息: 1-60分钟');
                return;
            }

            state.modes.work = work;
            state.modes.short = short;
            state.modes.long = long;
            
            saveToStorage(STORAGE_KEYS.MODES, state.modes);
            
            if (!state.isActive) {
                state.timeLeft = state.modes[state.currentMode] * 60;
                updateDisplay();
            }
            
            closeSettings();
        }

        els.startBtn.addEventListener('click', startTimer);
        els.resetBtn.addEventListener('click', resetTimer);
        els.setBtn.addEventListener('click', openSettings);
        
        els.tabs.forEach(tab => {
            tab.addEventListener('click', () => switchMode(tab.dataset.mode));
        });

        document.getElementById('closeBtn').addEventListener('click', closeSettings);
        document.getElementById('saveBtn').addEventListener('click', validateAndSave);

        els.notifyOk.addEventListener('click', () => {
            hideNotification();
            if (state.nextSuggestedMode) {
                switchMode(state.nextSuggestedMode);
            }
        });

        els.notifyCancel.addEventListener('click', hideNotification);

        els.modal.addEventListener('click', (e) => {
            if (e.target === els.modal) {
                closeSettings();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (els.modal.classList.contains('show')) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    validateAndSave();
                } else if (e.key === 'Escape') {
                    e.preventDefault();
                    closeSettings();
                }
            } else if (!els.notifyBar.classList.contains('show')) {
                if (e.key === ' ' && e.target === document.body) {
                    e.preventDefault();
                    startTimer();
                }
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && state.isActive && state.endTime) {
                const now = Date.now();
                const correctedTimeLeft = Math.max(0, Math.ceil((state.endTime - now) / 1000));
                
                if (correctedTimeLeft === 0) {
                    finishTimer();
                } else if (Math.abs(correctedTimeLeft - state.timeLeft) > 2) {
                    state.timeLeft = correctedTimeLeft;
                    updateDisplay();
                }
            }
        });

        applyTheme('work');
        updateDisplay();
        updateStats();

        if ('Notification' in window && Notification.permission === 'default') {
            const hasAsked = loadFromStorage(STORAGE_KEYS.NOTIFICATION_ASKED, false);
            if (!hasAsked) {
                setTimeout(() => {
                    Notification.requestPermission().then(() => {
                        saveToStorage(STORAGE_KEYS.NOTIFICATION_ASKED, true);
                    });
                }, 1000);
            }
        }
    </script>
</body>
</html>
