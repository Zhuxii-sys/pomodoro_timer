<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍅 精英番茄钟 Pro</title>
    <style>
        :root {
            --primary: #ef4444;
            --theme-color: #ef4444;
            --bg-work: linear-gradient(160deg, #fef2f2 0%, #fee2e2 100%);
            --bg-short: linear-gradient(160deg, #f0fdf4 0%, #dcfce7 100%);
            --bg-long: linear-gradient(160deg, #eff6ff 0%, #dbeafe 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "Microsoft YaHei", sans-serif; }
        body {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            background: var(--bg-work); transition: background 0.5s ease;
            overflow: hidden; user-select: none; -webkit-user-select: none;
            position: relative;
        }
        /* 通知条移到 body 最外层，避免遮挡标题 */
        #notifyBar {
            position: fixed; top: -70px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 380px; height: 56px;
            background: #1e293b; color: white; border-radius: 16px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; font-size: 0.9rem; font-weight: 600;
            transition: top 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
            z-index: 1000; box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }
        #notifyBar.show { top: 20px; }
        .notify-msg { flex: 1; text-align: center; }
        .notify-btns { display: flex; gap: 10px; }
        .notify-btn { padding: 6px 14px; border-radius: 10px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 700; }
        .glass-card {
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 32px;
            padding: 30px 35px 25px; width: 90%; max-width: 380px; max-height: 95vh;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08); text-align: center;
            display: flex; flex-direction: column; position: relative;
            z-index: 10;
        }
        h1 { font-size: 1.4rem; color: #1e293b; margin: 0 0 15px; font-weight: 800; }
        .tabs { display: flex; background: rgba(0,0,0,0.05); padding: 4px; border-radius: 12px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 8px; border: none; background: transparent; font-size: 0.85rem; font-weight: 600; color: #64748b; cursor: pointer; border-radius: 9px; transition: 0.3s; }
        .tab.active { background: white; color: var(--theme-color); box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .timer-box { position: relative; margin: 10px auto 20px; width: 200px; height: 200px; }
        .timer-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .circle-bg { fill: none; stroke: rgba(0,0,0,0.03); stroke-width: 8; }
        .circle-progress { fill: none; stroke: var(--theme-color); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.3s ease, stroke 0.5s; }
        .time-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 3rem; font-weight: 800; color: #1e293b; font-variant-numeric: tabular-nums; }
        .actions { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn { border: none; border-radius: 14px; cursor: pointer; font-weight: 700; transition: 0.2s; font-size: 0.9rem; }
        .btn-main { background: #1e293b; color: white; flex: 2; padding: 14px; }
        .btn-icon { background: white; color: #1e293b; flex: 1; border: 1px solid #e2e8f0; padding: 14px; }
        .stats-bar { display: flex; justify-content: space-around; padding-top: 15px; border-top: 1px solid rgba(0,0,0,0.05); }
        .stat { text-align: center; }
        .stat-v { display: block; font-size: 1.1rem; font-weight: 700; color: #1e293b; }
        .stat-l { font-size: 0.65rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(5px); z-index: 100; align-items: center; justify-content: center; }
        .modal-body { background: white; border-radius: 24px; padding: 25px; width: 280px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .s-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .s-label { font-size: 0.85rem; font-weight: 700; color: #475569; }
        .s-input { width: 75px; padding: 8px; border: 2px solid #f1f5f9; border-radius: 10px; text-align: center; font-weight: 800; color: var(--theme-color); user-select: auto; }
        .s-input:focus { border-color: var(--theme-color); outline: none; }
        .m-btns { display: flex; gap: 8px; margin-top: 20px; }
        .m-btns button { flex: 1; padding: 10px; border-radius: 12px; font-size: 0.85rem; font-weight: 700; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <!-- 通知条放在最外层，不遮挡卡片 -->
    <div id="notifyBar">
        <div class="notify-msg" id="notifyMsg">专注完成！</div>
        <div class="notify-btns">
            <button class="notify-btn" id="notifyOk">开始休息</button>
            <button class="notify-btn" id="notifyCancel" style="background:#475569;">忽略</button>
        </div>
    </div>

    <div class="glass-card">
        <h1>🍅 精英番茄钟 Pro</h1>
        <div class="tabs">
            <button class="tab active" data-mode="work">专注模式</button>
            <button class="tab" data-mode="short">短休息</button>
            <button class="tab" data-mode="long">长休息</button>
        </div>
        <div class="timer-box">
            <svg class="timer-svg" viewBox="0 0 300 300">
                <circle class="circle-bg" cx="150" cy="150" r="140"></circle>
                <circle class="circle-progress" id="progressCircle" cx="150" cy="150" r="140" stroke-dasharray="879.646" stroke-dashoffset="879.646"></circle>
            </svg>
            <div class="time-text" id="display">25:00</div>
        </div>
        <div class="actions">
            <button class="btn btn-main" id="startBtn">开始专注</button>
            <button class="btn btn-icon" id="resetBtn">重置</button>
            <button class="btn btn-icon" id="setBtn">⚙️</button>
        </div>
        <div class="stats-bar">
            <div class="stat"><span class="stat-v" id="statC">0</span><span class="stat-l">已完成番茄</span></div>
            <div class="stat"><span class="stat-v" id="statT">0</span><span class="stat-l">总专注分钟</span></div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-body">
            <div style="font-weight:800;margin-bottom:20px;text-align:center;color:#1e293b">偏好设置 (分钟)</div>
            <div class="s-row"><span class="s-label">工作时间</span><input type="number" class="s-input" id="inW" min="1" max="99" step="1"></div>
            <div class="s-row"><span class="s-label">短休息</span><input type="number" class="s-input" id="inS" min="1" max="60" step="1"></div>
            <div class="s-row"><span class="s-label">长休息</span><input type="number" class="s-input" id="inL" min="1" max="60" step="1"></div>
            <div class="m-btns">
                <button style="background:#f1f5f9; color:#64748b" id="closeBtn">取消</button>
                <button style="background:#1e293b; color:white" id="saveBtn">保存</button>
            </div>
        </div>
    </div>

    <script>
        const KEY = { M: 'pm_m_v11', S: 'pm_s_v11' };
        let modes = JSON.parse(localStorage.getItem(KEY.M)) || { work: 25, short: 5, long: 15 };
        let stats = JSON.parse(localStorage.getItem(KEY.S)) || { completed: 0, minutes: 0 };

        let state = {
            mode: 'work',
            left: modes.work * 60,
            active: false,
            end: null,
            tid: null,
            audioCtx: null,
            nextMode: null
        };

        const els = {
            display: document.getElementById('display'),
            circle: document.getElementById('progressCircle'),
            start: document.getElementById('startBtn'),
            reset: document.getElementById('resetBtn'),
            tabs: document.querySelectorAll('.tab'),
            statC: document.getElementById('statC'),
            statT: document.getElementById('statT'),
            modal: document.getElementById('modal'),
            inputs: {
                work: document.getElementById('inW'),
                short: document.getElementById('inS'),
                long: document.getElementById('inL')
            },
            notify: document.getElementById('notifyBar'),
            notifyMsg: document.getElementById('notifyMsg'),
            notifyOk: document.getElementById('notifyOk'),
            notifyCancel: document.getElementById('notifyCancel')
        };

        function initAudio() {
            if (!state.audioCtx) {
                state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (state.audioCtx.state === 'suspended') {
                state.audioCtx.resume();
            }
        }

        function playBeep() {
            initAudio();
            const o = state.audioCtx.createOscillator();
            const g = state.audioCtx.createGain();
            o.connect(g);
            g.connect(state.audioCtx.destination);
            o.frequency.setValueAtTime(880, state.audioCtx.currentTime);
            g.gain.setValueAtTime(0.15, state.audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, state.audioCtx.currentTime + 0.6);
            o.start();
            o.stop(state.audioCtx.currentTime + 0.6);
        }

        function update() {
            const m = Math.floor(state.left / 60);
            const s = state.left % 60;
            const timeStr = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            els.display.textContent = timeStr;

            const total = modes[state.mode] * 60 || 1;
            const progress = 1 - (state.left / total);
            els.circle.style.strokeDashoffset = 879.646 * progress;

            const icon = state.mode === 'work' ? '🍅' : '☕';
            const status = state.active ? '' : '❚❚ ';
            document.title = `${status}${icon} ${timeStr} - 精英番茄钟 Pro`;
        }

        function showNotify(msg, nextMode) {
            state.nextMode = nextMode;
            els.notifyMsg.textContent = msg;
            // 动态按钮颜色匹配当前主题
            const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--theme-color').trim();
            els.notifyOk.style.background = themeColor;
            els.notify.classList.add('show');
            playBeep();
        }

        function toggle() {
            initAudio(); // 确保首次点击能解锁音频（iOS 必要）
            if (state.active) {
                clearInterval(state.tid);
                state.active = false;
                els.start.textContent = state.mode === 'work' ? '开始专注' : '开始休息';
            } else {
                state.active = true;
                els.start.textContent = '暂停';
                state.end = Date.now() + state.left * 1000;
                state.tid = setInterval(() => {
                    const nowLeft = Math.max(0, Math.ceil((state.end - Date.now()) / 1000));
                    if (nowLeft === 0) {
                        finish();
                    } else {
                        state.left = nowLeft;
                        update();
                    }
                }, 200);
            }
            update();
        }

        function finish() {
            clearInterval(state.tid);
            state.active = false;
            state.left = 0;
            update();
            els.start.textContent = state.mode === 'work' ? '开始专注' : '开始休息';

            if (state.mode === 'work') {
                stats.completed++;
                stats.minutes += modes.work;
                localStorage.setItem(KEY.S, JSON.stringify(stats));
                els.statC.textContent = stats.completed;
                els.statT.textContent = stats.minutes;

                const next = stats.completed % 4 === 0 ? 'long' : 'short';
                showNotify('🎉 专注完成！建议休息一下', next);
            } else {
                showNotify('☕ 休息结束！准备下一轮专注', 'work');
            }
        }

        function switchM(m) {
            clearInterval(state.tid);
            state.active = false;
            state.mode = m;
            state.left = modes[m] * 60;
            els.notify.classList.remove('show');

            els.tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === m));

            const themes = {
                work: { bg: 'var(--bg-work)', c: '#ef4444' },
                short: { bg: 'var(--bg-short)', c: '#22c55e' },
                long: { bg: 'var(--bg-long)', c: '#3b82f6' }
            };
            document.body.style.background = themes[m].bg;
            document.documentElement.style.setProperty('--theme-color', themes[m].c);

            els.start.textContent = m === 'work' ? '开始专注' : '开始休息';
            els.reset.textContent = m === 'work' ? '重置' : '跳过休息';

            update();
        }

        function validateAndSave() {
            const w = parseInt(els.inputs.work.value) || 0;
            const s = parseInt(els.inputs.short.value) || 0;
            const l = parseInt(els.inputs.long.value) || 0;

            if ([w, s, l].some(v => v < 1 || v > 99 || isNaN(v))) {
                alert('⚠️ 请确保所有时间为 1~99 分钟的正整数！');
                return false;
            }

            modes = { work: w, short: s, long: l };
            localStorage.setItem(KEY.M, JSON.stringify(modes));
            els.modal.style.display = 'none';
            switchM(state.mode); // 立即应用新时间
            return true;
        }

        // 事件绑定
        els.start.onclick = toggle;

        els.reset.onclick = () => {
            if (state.active && !confirm(state.mode === 'work' ? '确定中断当前专注？' : '确定跳过当前休息？')) {
                return;
            }
            // 休息模式下“跳过”直接进入下一轮专注，其余情况仅重置当前模式
            if (state.mode !== 'work' && state.active) {
                switchM('work');
            } else {
                state.left = modes[state.mode] * 60;
                clearInterval(state.tid);
                state.active = false;
                update();
                els.start.textContent = state.mode === 'work' ? '开始专注' : '开始休息';
            }
        };

        els.tabs.forEach(t => t.onclick = () => {
            if (state.active && !confirm('正在计时中，确定切换模式？')) return;
            switchM(t.dataset.mode);
        });

        document.getElementById('setBtn').onclick = () => {
            els.inputs.work.value = modes.work;
            els.inputs.short.value = modes.short;
            els.inputs.long.value = modes.long;
            els.modal.style.display = 'flex';
        };

        document.getElementById('closeBtn').onclick = () => els.modal.style.display = 'none';
        document.getElementById('saveBtn').onclick = validateAndSave;

        els.notifyOk.onclick = () => {
            els.notify.classList.remove('show');
            switchM(state.nextMode);
        };
        els.notifyCancel.onclick = () => els.notify.classList.remove('show');

        // 页面切出/切入时修正时间漂移
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && state.active) {
                const corrected = Math.max(0, Math.ceil((state.end - Date.now()) / 1000));
                if (corrected === 0) {
                    finish();
                } else {
                    state.left = corrected;
                    update();
                }
            }
        });

        // 初始化
        els.statC.textContent = stats.completed;
        els.statT.textContent = stats.minutes;
        switchM('work'); // 确保初始主题和进度环正确
    </script>
</body>
</html>
